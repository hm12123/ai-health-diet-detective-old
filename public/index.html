<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남을 위한 AI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#0B0B0C; --fg:#fff; --dim:#8A8D93; --blue:#1A46F0;
    --line:#2A2C30; --panel:#16171A;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px; margin:0 auto; padding:72px 20px 96px}
  h1{font-size:44px; line-height:1.18; letter-spacing:-1.4px; font-weight:800; margin:0 0 14px}
  .desc{color:var(--dim); font-size:17px; line-height:1.65; margin:0 0 40px}
  label{display:block; font-size:13px; font-weight:700; letter-spacing:2px; color:#5E6066; margin-bottom:10px}
  textarea{
    width:100%; min-height:130px; resize:vertical; padding:16px;
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; font:inherit; font-size:16px; line-height:1.6;
  }
  textarea:focus{outline:none; border-color:var(--blue)}
  button{
    margin-top:14px; padding:14px 28px; border:0; border-radius:6px;
    background:var(--blue); color:#fff; font:inherit; font-size:16px; font-weight:700;
    cursor:pointer;
  }
  button:disabled{opacity:.45; cursor:default}
  #out{margin-top:40px}
  .card{border-top:3px solid var(--line); padding-top:22px}
  .card .tag{font-size:13px; font-weight:700; letter-spacing:2px; color:var(--dim); margin-bottom:12px}
  .card .body{font-size:18px; line-height:1.75; white-space:pre-wrap}
  .ask{border-top-color:var(--blue)}
  .ask .tag{color:var(--blue)}
  .err{border-top-color:#8A8D93}
  .foot{margin-top:72px; padding-top:20px; border-top:1px solid var(--line);
        color:#5E6066; font-size:13px; line-height:1.8}
  @media (max-width:520px){ h1{font-size:34px} .wrap{padding:48px 18px 72px} }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">준비 중</h1>
  <p class="desc" id="desc"></p>

  <label for="q">무엇이 필요한가요</label>
  <textarea id="q" placeholder=""></textarea>
  <button id="go">물어보기</button>

  <div id="out"></div>

  <div class="foot">
    입력한 내용은 저장하지 않습니다. 답변을 만드는 데에만 쓰이고 바로 사라집니다.<br>
    사람 이름, 연락처, 학번 같은 것은 적지 마세요.
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

fetch("/api/meta").then(r => r.json()).then(m => {
  $("title").textContent = m.제목 || "남을 위한 AI";
  $("desc").textContent = m.설명 || "";
  $("q").placeholder = m.입력안내 || "";
  $("go").textContent = m.버튼 || "물어보기";
  document.title = m.제목 || document.title;
}).catch(() => {});

function 보여주기(상태, 내용) {
  const cls = 상태 === "물음" ? "card ask" : (상태 === "오류" ? "card err" : "card");
  const tag = 상태 === "물음" ? "먼저 확인할 것" : (상태 === "오류" ? "실패" : "답");
  $("out").innerHTML =
    '<div class="' + cls + '"><div class="tag">' + tag + '</div>' +
    '<div class="body"></div></div>';
  $("out").querySelector(".body").textContent = 내용;
}

async function 물어보기() {
  const 입력 = $("q").value.trim();
  if (!입력) { $("q").focus(); return; }
  $("go").disabled = true;
  보여주기("답", "생각하는 중…");
  try {
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ 입력 }),
    });
    const d = await r.json();
    보여주기(d.상태 || "답", d.내용 || "답을 받지 못했습니다.");
  } catch {
    보여주기("오류", "연결에 실패했습니다. 잠시 뒤 다시 시도해 주세요.");
  } finally {
    $("go").disabled = false;
  }
}

$("go").addEventListener("click", 물어보기);
$("q").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") 물어보기();
});
</script>
</body>
</html>
